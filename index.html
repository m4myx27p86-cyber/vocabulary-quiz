<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock 3000</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #f5f5f5;
}

.container {
    background: white;
    width: 80%;
    margin: auto;
    margin-top: 30px;
    padding: 20px;
    border-radius: 10px;
}

button {
    display: block;
    width: 80%;
    margin: 10px auto;
    padding: 15px;
    font-size: 18px;
    cursor: pointer;
    border: none;
}

.choice-btn {
    background: #4CAF50;
    color: white;
}

.next-btn {
    background: #2196F3;
    color: white;
}

.review-btn {
    background: orange;
    color: white;
}

select, input {
    padding: 10px;
    margin: 10px;
    font-size: 16px;
}

#result {
    font-weight: bold;
    font-size: 20px;
}

#score {
    font-weight: bold;
    color: darkblue;
}
</style>
</head>

<body>

<div class="container">

    <h1>Stock 3000</h1>

    <!-- Password Area -->
    <div id="loginArea">
        <h2>Enter Password</h2>
        <input type="password" id="passwordInput" placeholder="Password">
        <button onclick="checkPassword()">Login</button>
        <p id="loginMessage"></p>
    </div>

    <!-- Quiz Area -->
    <div id="quizArea" style="display:none;">

        <select id="sectionSelect">
            <option value="all">All Sections</option>
        </select>

        <select id="questionCount">
            <option value="10">10 Questions</option>
            <option value="20">20 Questions</option>
            <option value="50">50 Questions</option>
            <option value="100">100 Questions</option>
            <option value="all">All Questions</option>
        </select>

        <button onclick="startNormalQuiz()">Start Quiz</button>
        <button class="review-btn" onclick="startReviewQuiz()">Review Mistakes</button>
        <button onclick="clearMistakes()">Clear Mistakes</button>

        <h2 id="question"></h2>
        <div id="choices"></div>

        <p id="result"></p>
        <p id="score"></p>
        <p id="mistakeCount"></p>
        <p id="timer"></p>

        <button class="next-btn" onclick="nextQuestion()">Next Question</button>

    </div>

</div>

<script>
const PASSWORD = "stock3000";

let allQuestions = [];
let quizQuestions = [];
let currentQuestionIndex = 0;
let score = 0;
let answered = false;
let reviewMode = false;

let startTime;
let endTime;

function checkPassword() {
    const input =
        document.getElementById("passwordInput").value;

    if (input === PASSWORD) {
        document.getElementById("loginArea").style.display = "none";
        document.getElementById("quizArea").style.display = "block";
    } else {
        document.getElementById("loginMessage").innerText =
            "Incorrect password.";
    }
}

fetch("stock_3000_master.csv")
.then(response => response.text())
.then(data => {
    const rows = data.trim().split("\n").slice(1);

    allQuestions = rows.map(row => {
        const cols = row.split(",");

        return {
            id: cols[0],
            section: cols[1],
            word: cols[2],
            correct: cols[3],
            choices: [cols[3], cols[4], cols[5], cols[6]],
            points: parseInt(cols[7]) || 1
        };
    });

    loadSections();
})
.catch(error => console.error(error));

function loadSections() {
    const sectionSelect =
        document.getElementById("sectionSelect");

    const uniqueSections =
        [...new Set(
            allQuestions
                .map(q => q.section)
                .filter(section =>
                    section !== undefined &&
                    section !== null &&
                    section.trim() !== ""
                )
        )];

    uniqueSections.sort((a,b)=> Number(a)-Number(b));

    uniqueSections.forEach(section => {
        const option = document.createElement("option");
        option.value = section;
        option.textContent = "Section " + section;
        sectionSelect.appendChild(option);
    });
}

function startNormalQuiz() {
    reviewMode = false;
    score = 0;
    currentQuestionIndex = 0;

    const selectedSection =
        document.getElementById("sectionSelect").value;

    const questionCount =
        document.getElementById("questionCount").value;

    if (selectedSection === "all") {
        quizQuestions = [...allQuestions];
    } else {
        quizQuestions =
            allQuestions.filter(
                q => q.section === selectedSection
            );
    }

    shuffleArray(quizQuestions);

    if (questionCount !== "all") {
        quizQuestions =
            quizQuestions.slice(
                0,
                parseInt(questionCount)
            );
    }

    startTime = new Date();

    showQuestion();
}

function startReviewQuiz() {
    reviewMode = true;
    score = 0;
    currentQuestionIndex = 0;

    const wrongWords =
        JSON.parse(
            localStorage.getItem("wrongWords")
        ) || [];

    quizQuestions =
        allQuestions.filter(
            q => wrongWords.includes(q.id)
        );

    if (quizQuestions.length === 0) {
        document.getElementById("question").innerText =
            "No mistakes saved!";
        document.getElementById("choices").innerHTML = "";
        return;
    }

    shuffleArray(quizQuestions);

    startTime = new Date();

    showQuestion();
}

function showQuestion() {
    answered = false;

    if (currentQuestionIndex >= quizQuestions.length) {
        endTime = new Date();

        const totalSeconds =
            Math.floor(
                (endTime - startTime) / 1000
            );

        const minutes =
            Math.floor(totalSeconds / 60);

        const seconds =
            totalSeconds % 60;

        document.getElementById("question").innerText =
            "Quiz Finished!";

        document.getElementById("choices").innerHTML = "";

        document.getElementById("timer").innerText =
            `Time: ${minutes} min ${seconds} sec`;

        return;
    }

    const q =
        quizQuestions[currentQuestionIndex];

    document.getElementById("question").innerText =
        `No.${q.id} | Section ${q.section}
What is the meaning of "${q.word}"?`;

    let choices = [...q.choices];
    shuffleArray(choices);

    const choicesDiv =
        document.getElementById("choices");

    choicesDiv.innerHTML = "";

    choices.forEach(choice => {
        const btn =
            document.createElement("button");

        btn.innerText = choice;
        btn.className = "choice-btn";

        btn.onclick = () => {
            checkAnswer(choice, q);
        };

        choicesDiv.appendChild(btn);
    });

    updateScore();
    updateMistakeCount();
}

function checkAnswer(choice, q) {
    if (answered) return;

    answered = true;

    if (choice === q.correct) {
        document.getElementById("result").innerText =
            "✅ Correct!";
        score += q.points;

        if (reviewMode) {
            removeWrongWord(q.id);
        }

    } else {
        document.getElementById("result").innerText =
            `❌ Wrong! Correct Answer: ${q.correct}`;
        saveWrongWord(q.id);
    }

    disableButtons();
    updateScore();
    updateMistakeCount();
}

function nextQuestion() {
    currentQuestionIndex++;
    document.getElementById("result").innerText = "";
    showQuestion();
}

function saveWrongWord(id) {
    let wrongWords =
        JSON.parse(
            localStorage.getItem("wrongWords")
        ) || [];

    if (!wrongWords.includes(id)) {
        wrongWords.push(id);
    }

    localStorage.setItem(
        "wrongWords",
        JSON.stringify(wrongWords)
    );
}

function removeWrongWord(id) {
    let wrongWords =
        JSON.parse(
            localStorage.getItem("wrongWords")
        ) || [];

    wrongWords =
        wrongWords.filter(
            wordId => wordId !== id
        );

    localStorage.setItem(
        "wrongWords",
        JSON.stringify(wrongWords)
    );
}

function clearMistakes() {
    localStorage.removeItem("wrongWords");
    updateMistakeCount();
}

function updateScore() {
    document.getElementById("score").innerText =
        "Score: " + score;
}

function updateMistakeCount() {
    const wrongWords =
        JSON.parse(
            localStorage.getItem("wrongWords")
        ) || [];

    document.getElementById("mistakeCount").innerText =
        "Saved Mistakes: " + wrongWords.length;
}

function disableButtons() {
    const buttons =
        document.querySelectorAll(".choice-btn");

    buttons.forEach(btn => {
        btn.disabled = true;
    });
}

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [array[i], array[j]] =
            [array[j], array[i]];
    }
}
</script>

</body>
</html>
