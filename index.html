<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英語テスト</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>英語テスト</h1>

    <section id="loginScreen">
      <p>パスワードを入力してください。</p>
      <input type="password" id="passwordInput" placeholder="パスワードを入力" />
<label>
  <input type="checkbox" id="showPassword">
  パスワードを表示
</label>
      <button id="loginButton">ログイン</button>
      <p id="loginMessage" class="error"></p>
    </section>

    <section id="menuScreen" class="hidden">
      <h2>教材を選択してください</h2>
      <button id="sentenceTestButton">語順並べ替えテスト</button>
      <button disabled>Coming Soon</button>
    </section>

    <section id="idScreen" class="hidden">
      <h2>回答者番号を入力してください</h2>
      <input type="text" id="studentIdInput" placeholder="例：A001" />
      <button id="startButton">開始</button>
    </section>

    <section id="quizScreen" class="hidden">
      <h2 id="questionNumber"></h2>
      <div id="wordsDisplay" class="words"></div>

      <input type="text" id="answerInput" placeholder="英文を入力してください" />
      <br />
      <button id="checkButton">回答する</button>

      <p id="feedback"></p>
      <button id="nextButton" class="hidden">次の問題へ</button>
    </section>

    <section id="resultScreen" class="hidden">
      <h2>結果</h2>
      <p id="scoreDisplay"></p>
      <p id="dateDisplay"></p>
      <button id="restartButton">もう一度解く</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
