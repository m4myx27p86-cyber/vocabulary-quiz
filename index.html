<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英語テスト</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>英語テスト</h1>

    <section id="loginScreen">
      <p>パスワードを入力してください。</p>
      <input type="password" id="passwordInput" placeholder="パスワードを入力" />
      <label class="password-toggle">
        <input type="checkbox" id="showPassword" />
        パスワードを表示
      </label>
      <button id="loginButton">ログイン</button>
      <p id="loginMessage" class="error"></p>
    </section>

    <section id="menuScreen" class="hidden">
      <h2>教材を選択してください</h2>
      <button id="vocabTestButton">Stock 3000 単語テスト</button>
      <button id="sentenceTestButton">語順並べ替えテスト</button>
      <button disabled>Coming Soon</button>
    </section>

    <section id="settingScreen" class="hidden">
      <h2 id="settingTitle"></h2>

      <input type="text" id="studentIdInput" placeholder="回答者番号 例：A001" />

      <div id="commonSettings">
        <select id="sectionSelect"></select>

        <select id="questionCountSelect">
          <option value="10">10問</option>
          <option value="20" selected>20問</option>
          <option value="30">30問</option>
          <option value="50">50問</option>
          <option value="100">100問</option>
          <option value="all">すべて</option>
        </select>
      </div>

      <div id="vocabReviewArea" class="hidden">
        <p id="settingMistakeCount"></p>
        <button id="reviewButton" class="secondary-button">間違えた問題を復習</button>
        <button id="clearStoredMistakesButton" class="secondary-button">間違い履歴を削除</button>
      </div>

      <button id="startButton">テスト開始</button>
      <button id="backToMenuButton" class="secondary-button">戻る</button>
    </section>

    <section id="quizScreen" class="hidden">
      <h2 id="testTitle"></h2>
      <h3 id="questionNumber"></h3>

      <div id="questionArea"></div>

      <p id="feedback"></p>

      <button id="checkButton">回答する</button>
      <button id="nextButton" class="hidden">次の問題へ</button>
      <button id="quitButton" class="quit-button">途中で終了する</button>
    </section>

    <section id="resultScreen" class="hidden">
      <h2>結果</h2>
      <p id="scoreDisplay"></p>
      <p id="dateDisplay"></p>
      <p id="timeDisplay"></p>
      <div id="mistakeArea"></div>
      <button id="restartButton">最初に戻る</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
